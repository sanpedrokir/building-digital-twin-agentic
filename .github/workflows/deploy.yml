name: Deploy to Amplify

on:
  push:
    branches: [main]

jobs:
  mirror-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to Amplify repo and trigger build
        run: |
          git remote add amplify-repo https://x-access-token:${{ secrets.GH_PAT }}@github.com/sanpedrokir/building-digital-twin.git
          git push amplify-repo HEAD:main --force
